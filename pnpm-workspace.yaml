packages:
  - 'packages/**'
  # 排除 uni-app 等随应用 vendored 的第三方模块（自带 package.json，否则会被 ** 误收为工作区包）
  - '!**/uni_modules/**'

# 成员依赖的构建脚本由容器根批准。
allowBuilds:
  esbuild: true
  vue-demi: true
  # 以下依赖的构建脚本本仓用不到（lerna / 模板工具链的可选原生件），显式不构建。
  '@parcel/watcher': false
  nodejieba: false
  nx: false

# 只引入发布满 14 天的版本（含传递依赖），单位：分钟。
minimumReleaseAge: 20160
