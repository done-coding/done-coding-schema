# ============================================================
# 工作流名称：Publish from merged PR
# 触发条件：Pull Request 被合并到 prerelease 或 release 分支时触发
# 核心流程：
#   1. 将 master 最新代码同步到本地目标分支（确保基于主干最新代码发布）
#   2. 安装依赖，lerna version 定版本并同步 Python 包版本（本地生成版本提交和标签，不推送）
#   3. 构建 npm 包与 Python 包并跑全部检查，核对版本形态
#   4. 上传 npm（预发布 alpha、正式 latest）与 PyPI
#   5. 推送目标分支和 Git 标签到远端
#   6. 目标为 release 时：将 master 快进到 release，并把 prerelease 重置到 master
# 文件名已登记为 npm 与 PyPI 的可信发布者，改名需同步修改两边的登记。
# 来源：done-coding-template-hub 模板 monorepo-standalone 的 .github/workflows/oidc-release.yml。
# 本仓差异（Python 包）：安装 uv；version 拆出为单独步骤并加 --force-publish（正式版另加
#   --conventional-graduate）；构建后跑 pnpm check 与 check:min-versions；核对版本形态；
#   上传 PyPI。这几处与 npm 部分的顺序是：定版本 → 构建与检查 → 核对形态 → npm → PyPI。
# 不设 NODE_AUTH_TOKEN / NPM_TOKEN / UV_PUBLISH_TOKEN：没登记可信发布时上传以认证错误失败，
# 不回退到长期令牌。前提与登记方法见 docs/release.md。
# ============================================================

name: Publish from merged PR

# ------------------------------------------------------------
# 可配置的版本变量（修改此处即可全局生效）
# ------------------------------------------------------------
env:
  NODE_VERSION: "22" # Node.js 主版本号
  NPM_VERSION: "11.21.1" # npm 精确版本号，可信发布要求 11.5.1 及以上
  UV_VERSION: "0.11.32" # uv 精确版本号（构建与上传 Python 包）

# ------------------------------------------------------------
# 触发条件：仅监听 prerelease、release 分支的 PR 被关闭事件
# ------------------------------------------------------------
on:
  pull_request:
    types:
      - closed # PR 关闭时触发（包含合并关闭和直接关闭）
    branches:
      - prerelease
      - release

# ------------------------------------------------------------
# 并发控制：同一目标分支只允许一个发布任务运行，避免并发冲突
# ------------------------------------------------------------
concurrency:
  group: ${{ github.event.pull_request.base.ref }}-publish
  cancel-in-progress: false # 不取消正在运行的任务，新任务排队等待

jobs:
  publish:
    # --------------------------------------------------------
    # 关键过滤：仅当 PR 真正被合并时才执行，直接关闭的 PR 跳过
    # --------------------------------------------------------
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    # 必须显式声明权限，确保 GITHUB_TOKEN 有推送代码和标签的能力
    permissions:
      contents: write
      id-token: write # npm 与 PyPI 可信发布通过 OIDC 换取临时凭据

    steps:
      # --------------------------------------------------------
      # 步骤 1：检出代码
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整 Git 历史，供 lerna 计算版本号
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      # --------------------------------------------------------
      # 步骤 2：安装 pnpm（版本取仓根 package.json 的 packageManager）
      # --------------------------------------------------------
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      # --------------------------------------------------------
      # 步骤 3：安装 Node.js（版本从环境变量读取）
      # --------------------------------------------------------
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      # --------------------------------------------------------
      # 步骤 4：升级 npm（Node 22 自带的 npm 不支持可信发布）
      # --------------------------------------------------------
      - name: Install npm CLI for trusted publishing
        run: npm install --global npm@${{ env.NPM_VERSION }}

      # --------------------------------------------------------
      # 步骤 5：安装 uv（版本从环境变量读取），用于生成检查与 Python 包的构建、上传
      # --------------------------------------------------------
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: ${{ env.UV_VERSION }}

      # --------------------------------------------------------
      # 步骤 6：配置 Git 用户信息
      # --------------------------------------------------------
      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          # 使用 GitHub Actions 官方虚拟邮箱，确保提交正确归属 Bot
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # --------------------------------------------------------
      # 步骤 7：将 master 分支的最新代码同步到本地目标分支
      # --------------------------------------------------------
      # 目的：确保本次发布基于最新的主干代码（包含所有已上线的 hotfix）
      # 注意：仅在本地合并，不推送到远端，避免触发额外的 CI 运行
      # --------------------------------------------------------
      - name: Sync master into target branch (locally)
        run: |
          git fetch origin master
          # 使用 --no-ff 保留合并历史，提交信息带 [skip ci] 是防御性措施
          git merge origin/master --no-ff -m "chore: sync master into $PUBLISH_BRANCH [skip ci]"
        env:
          PUBLISH_BRANCH: ${{ github.event.pull_request.base.ref }}

      # --------------------------------------------------------
      # 步骤 8：安装项目依赖
      # --------------------------------------------------------
      - name: Install dependencies
        run: pnpm install

      # --------------------------------------------------------
      # 步骤 9：Lerna 定版本（本地生成提交和标签，不推送）
      # --------------------------------------------------------
      # 关键参数：
      #   prerelease               预发使用 prerelease 版本策略（如 1.0.0 → 1.0.1-alpha.0）
      #   --preid alpha            预发布标识符前缀
      #   --force-publish          两个包共用一个版本号：只改了 Python 包时 lerna 会判 npm 包
      #                            「无变化」而不出版本，发布就此停住；加上它，任一边有改动都一起出版本
      #   --conventional-graduate  正式版：当前是预发布版本（如 0.0.1-alpha.4）时转为正式版本
      #                            （0.0.1）；不加时约定式提交只会把预发布号加一，步骤 11 会拒绝
      #   --yes                    跳过所有交互式确认
      #   --no-push                禁止 Lerna 自动推送，由我们手动控制推送时机
      #   --message                自定义版本提交信息，包含 [skip ci] 防止循环触发
      # 仓根 package.json 的 version 生命周期脚本会在提交前把同一版本写进
      # python/pyproject.toml 与 python/uv.lock（npm 的 X.Y.Z-alpha.N 写作 X.Y.ZaN），
      # 两个包的版本因此落在同一个版本提交里。
      # Lerna 9 的 lerna publish 一条命令会把内部依赖写回旧版本，
      # 因此拆成 version 与 publish from-package（步骤 12）两个进程。
      # --------------------------------------------------------
      - name: Version packages (no push)
        run: |
          if [ "$PUBLISH_BRANCH" = prerelease ]; then
            npx lerna version prerelease --force-publish --yes --preid alpha --no-push --message "chore(prerelease): publish [skip ci]"
          else
            npx lerna version --force-publish --conventional-graduate --yes --no-push --message "chore(release): publish [skip ci]"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          PUBLISH_BRANCH: ${{ github.event.pull_request.base.ref }}

      # --------------------------------------------------------
      # 步骤 10：构建 npm 包与 Python 包，并跑全部检查
      # --------------------------------------------------------
      # 发布前构建所有包：考虑某些依赖会是其他不需要发版的workspace包。
      # pnpm check 含样例校验、生成物一致、两包版本一致、两语言测试与构建产物检查，
      # 任一不过即停，不上传任何包。pnpm check:min-versions 再在最低支持版本上跑一遍
      # Python 测试（要联网装包，耗时较长，所以不在 pnpm check 里）。
      # --------------------------------------------------------
      - name: Build and check
        run: |
          npx lerna run build
          # 构建会重新生成已提交的自动产物 d.ts（如 components.d.ts / auto-imports.d.ts），
          # 弄脏工作树会让 lerna publish 因 "working tree has uncommitted changes" 中止。
          # 这类 d.ts 不影响运行逻辑：若 dirty 仅限 *.d.ts → 回退保持工作树干净；否则报错退出。
          dirty=$(git diff --name-only)
          if [ -n "$dirty" ]; then
            if echo "$dirty" | grep -qvE '\.d\.ts$'; then
              echo "unexpected non-d.ts dirty files after build:" >&2
              echo "$dirty" >&2
              exit 1
            fi
            echo "$dirty" | xargs git checkout --
            echo "reset auto-generated d.ts to keep working tree clean"
          fi
          uv build --project python
          pnpm check
          # 最低支持版本（Python、pydantic 等取自 python/pyproject.toml 的下界）上再跑一遍
          # 全部 Python 测试：装本机构建的 wheel，用临时环境，跑完清理。
          pnpm check:min-versions

      # --------------------------------------------------------
      # 步骤 11：核对版本形态
      # --------------------------------------------------------
      # PyPI 没有 dist-tag，上传即成为可安装的版本：预发布必须是 PEP 440 预发布版本
      # （如 1.0.1a0，pip 默认不会装到），正式发布只接受 X.Y.Z；不符时在上传前停下。
      # --------------------------------------------------------
      - name: Check version form
        run: |
          version=$(uv version --project python --short)
          if [ "$PUBLISH_BRANCH" = prerelease ]; then
            pattern='(a|b|rc)[0-9]+$'
            expected="预发布版本"
          else
            pattern='^[0-9]+\.[0-9]+\.[0-9]+$'
            expected="X.Y.Z"
          fi
          if ! echo "$version" | grep -qE "$pattern"; then
            echo "$PUBLISH_BRANCH 只接受$expected，当前 Python 包版本为 $version" >&2
            exit 1
          fi
        env:
          PUBLISH_BRANCH: ${{ github.event.pull_request.base.ref }}

      # --------------------------------------------------------
      # 步骤 12：发布 npm 包
      # --------------------------------------------------------
      # from-package：发布 package.json 里的版本中尚未出现在 npm 上的包
      #   --dist-tag   预发布到 alpha（不影响 latest），正式发布到 latest
      # --------------------------------------------------------
      - name: Publish npm package
        run: |
          if [ "$PUBLISH_BRANCH" = prerelease ]; then
            npx lerna publish from-package --yes --dist-tag alpha
          else
            npx lerna publish from-package --yes --dist-tag latest
          fi
        env:
          PUBLISH_BRANCH: ${{ github.event.pull_request.base.ref }}

      # --------------------------------------------------------
      # 步骤 13：发布 Python 包
      # --------------------------------------------------------
      # --trusted-publishing always：只走 PyPI 可信发布，拿不到 OIDC 凭据即失败，不找长期令牌。
      # --check-url：重跑时跳过 PyPI 上已有的文件。
      # --------------------------------------------------------
      - name: Publish Python package
        run: |
          uv publish --trusted-publishing always --check-url https://pypi.org/simple/ python/dist/*

      # --------------------------------------------------------
      # 步骤 14：推送目标分支和 Git 标签
      # --------------------------------------------------------
      # --follow-tags 确保 lerna 生成的标签一并推送
      # --------------------------------------------------------
      - name: Push target branch and tags
        run: git push --follow-tags origin "$PUBLISH_BRANCH"
        env:
          PUBLISH_BRANCH: ${{ github.event.pull_request.base.ref }}

      # --------------------------------------------------------
      # 步骤 15：将 master 分支快进到 release（仅 release）
      # --------------------------------------------------------
      # 由于 release 已经包含了 master 的全部历史，此操作必然是快进合并，
      # 不会产生任何冲突，也不需要反向合并。
      # --------------------------------------------------------
      - name: Fast-forward master to release
        if: github.event.pull_request.base.ref == 'release'
        run: |
          git fetch origin master
          git checkout master
          git merge --ff-only origin/release
          git push origin master

      # --------------------------------------------------------
      # 步骤 16：将 prerelease 分支重置到 master（仅 release）
      # --------------------------------------------------------
      # prerelease 为预发环境部署分支，始终镜像 master 最新状态。
      # 使用 --force 覆盖是安全的：功能分支不会删除，远端无独立提交需要保留。
      # --------------------------------------------------------
      - name: Sync prerelease to master
        if: github.event.pull_request.base.ref == 'release'
        run: git push origin master:prerelease --force
